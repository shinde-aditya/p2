<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro-Fest - Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F2F5FA; --ink:#14213D; --muted:#5B6B86; --card:#FFFFFF; --line:#D6DFEC;
  --teal:#12988A; --good:#1E9E3A; --bad:#C9281B; --navy:#14213D;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(14px,1.15vw,30px)}
html.host{font-size:clamp(13px,.95vw,20px)}
body{font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;overflow:hidden}
button,select,input{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.main{flex:1;min-height:0;padding:1.2rem 2.2rem;display:flex;flex-direction:column;overflow:auto}
.main>:first-child{margin-top:auto}.main>:last-child{margin-bottom:auto}
.center{text-align:center}

/* header: logo + Astro-Fest title + six-colour stripe from the logo */
.hdr{display:flex;align-items:center;gap:1.1rem;padding:.6rem 1.6rem;background:#fff;position:relative}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.35rem;
  background:linear-gradient(90deg,#1E6BB8 0 16.6%,#27A93A 0 33.3%,#EE7410 0 50%,#86239A 0 66.6%,#1AA394 0 83.3%,#C9281B 0)}
.hdr img{width:5rem;height:5rem;object-fit:contain}
.hdr .ttl{flex:1}
.hdr .ttl b{display:block;font-size:2.7rem;font-weight:800;line-height:1;letter-spacing:.02em}
.hdr .ttl span{font-size:1rem;color:var(--muted);font-weight:600}
.hdr .meta{text-align:right;font-weight:700;font-size:1.2rem;line-height:1.15}
.hdr .meta small{display:block;font-size:.95rem;color:var(--muted);font-weight:600}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#C9281B;margin-right:.4rem;vertical-align:middle}
.dot.on{background:#1E9E3A}

h1.big{font-size:3.6rem;font-weight:800;line-height:1.05}
p.sub{font-size:1.5rem;color:var(--muted);font-weight:600;margin-top:.5rem}

/* question block */
.qmeta{font-size:1.15rem;font-weight:700;color:var(--muted);margin-bottom:.4rem}
.qtext{font-size:2.5rem;font-weight:800;line-height:1.15;max-width:62rem;margin-bottom:1rem}
.banner{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-radius:1rem;padding:.7rem 1.4rem;margin-bottom:1rem;font-weight:800;font-size:1.6rem;background:var(--card);border:.15rem solid var(--line)}
.banner .name{font-size:3rem;line-height:1}
.banner small{display:block;font-size:1.05rem;font-weight:700;opacity:.9}
.banner.open{border-color:var(--teal)}
.banner.buzzed{background:var(--c);color:#fff;border-color:var(--c)}
.banner.good{background:#E4F6E8;border-color:var(--good);color:#126326}
.banner.bad{background:#FBE6E3;border-color:var(--bad);color:#8E1A10}
.banner.none{background:#EEF1F6;color:var(--muted)}
.timer{display:flex;align-items:center;gap:.7rem;min-width:9rem;justify-content:flex-end}
.timer .num{font-size:2.6rem;font-weight:800;line-height:1;min-width:2.3rem;text-align:right}
.timer .track{width:5rem;height:.7rem;border-radius:1rem;background:rgba(0,0,0,.14);overflow:hidden}
.timer .fill{height:100%;width:100%;background:currentColor;transition:width .25s linear}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt{display:flex;align-items:center;gap:.9rem;text-align:left;background:var(--card);border:.15rem solid var(--line);border-radius:.9rem;padding:.8rem 1.1rem;font-size:1.6rem;font-weight:700;cursor:default}
.opt .l{flex:none;width:2.6rem;height:2.6rem;border-radius:.6rem;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1.35rem;font-weight:800}
.opt.pick{cursor:pointer}
.opt.pick:hover{border-color:var(--teal);background:#EAF8F6}
.opt.correct{background:#E4F6E8;border-color:var(--good)}
.opt.correct .l{background:var(--good)}
.opt.wrong{background:#FBE6E3;border-color:var(--bad);text-decoration:line-through}
.opt.wrong .l{background:var(--bad)}
.opt.dim{opacity:.45}

/* player chips on the big screen */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:.7rem;padding:.8rem 1.6rem 1rem;background:#fff;border-top:.15rem solid var(--line)}
.chip{display:flex;align-items:center;justify-content:space-between;gap:.5rem;background:var(--bg);border:.15rem solid var(--line);border-left:.6rem solid var(--c);border-radius:.8rem;padding:.4rem .9rem;min-width:0}
.chip .who{min-width:0}
.chip .who b{display:block;font-size:1.35rem;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .who small{font-size:.85rem;font-weight:700;color:var(--muted)}
.chip .sc{font-size:2.3rem;font-weight:800;line-height:1;color:var(--c)}
.chip.active{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.04);box-shadow:0 .3rem 1rem rgba(0,0,0,.25)}
.chip.active .sc,.chip.active .who small{color:#fff}
.chip.out{opacity:.5}
.chip.empty{border-style:dashed;color:#9AA7BD}

/* final */
.trophy{font-size:6rem;line-height:1}
.win-name{font-size:6.2rem;font-weight:800;line-height:1.02;margin:.2rem 0}
.win-sub{font-size:1.9rem;font-weight:700;color:var(--muted)}
.rank{display:flex;justify-content:center;gap:.8rem;margin-top:1.3rem;flex-wrap:wrap}
.rank div{background:var(--card);border:.15rem solid var(--line);border-top:.45rem solid var(--c);border-radius:.8rem;padding:.4rem 1.1rem;font-weight:700;font-size:1.25rem}
.rank div b{font-size:1.8rem;color:var(--c);margin-left:.4rem}
@media (prefers-reduced-motion:no-preference){
  .win-name{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
  .trophy{animation:pop .9s .15s cubic-bezier(.2,1.6,.4,1) both}
  .chip.active{animation:throb .9s ease-in-out infinite alternate}
}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes throb{to{transform:scale(1.07)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}

/* player PC */
.pwrap{max-width:62rem;margin:0 auto;width:100%;text-align:center}
.me{display:inline-flex;align-items:center;gap:1.4rem;background:var(--card);border:.15rem solid var(--line);border-left:.8rem solid var(--c);border-radius:1rem;padding:.6rem 1.5rem;margin-bottom:1.3rem;text-align:left}
.me b{font-size:2.2rem;font-weight:800;line-height:1.1;display:block}
.me small{font-size:.95rem;color:var(--muted);font-weight:600}
.keytag{font-weight:800;font-size:1.05rem;background:var(--navy);color:#fff;border-radius:.4rem;padding:.15rem .7rem;white-space:nowrap}
.pwrap .qtext{margin-left:auto;margin-right:auto}
.pwrap .opts{text-align:left}
.buzzbtn{display:block;width:100%;max-width:34rem;margin:1.2rem auto 0;padding:1.4rem;border-radius:1.4rem;border:0;background:var(--c);color:#fff;font-size:2.4rem;font-weight:800;cursor:pointer;box-shadow:0 .45rem 0 rgba(0,0,0,.28)}
.buzzbtn:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .2rem 0 rgba(0,0,0,.28)}
.buzzbtn:disabled{background:#9AA7BD;box-shadow:none;cursor:not-allowed}
.joinbox{display:grid;gap:.8rem;max-width:30rem;margin:1.2rem auto 0}
.joinbox input{font-size:1.8rem;font-weight:700;padding:.7rem 1rem;border:.15rem solid var(--line);border-radius:.8rem;background:#fff}
.note{font-size:1.2rem;color:var(--muted);font-weight:600;margin-top:.8rem}

/* host & landing */
.hostgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:1.2rem;align-items:start;width:100%;max-width:92rem;margin:0 auto}
.col{display:grid;gap:1rem;align-content:start;min-width:0}
.card{background:var(--card);border:.15rem solid var(--line);border-radius:1rem;padding:1rem 1.3rem}
.card h2{font-size:1.5rem;font-weight:800;margin-bottom:.6rem}
.card p{color:var(--muted);font-weight:600}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.8rem}
.plist{display:grid;gap:.5rem}
.plist .pr{display:flex;align-items:center;gap:.7rem;border-left:.5rem solid var(--c);background:var(--bg);border-radius:.6rem;padding:.35rem .8rem;font-weight:700;font-size:1.2rem}
.plist .pr span{flex:1}
.plist .pr.free{opacity:.6;color:#7E8DA8;font-weight:600}
.btn{border:0;border-radius:.6rem;padding:.5rem 1.1rem;font-weight:700;cursor:pointer;background:#2B3A5E;color:#fff;font-size:1.05rem}
.btn:hover{background:#3A4C78}
.btn.go{background:var(--teal)}
.btn.go:hover{background:#0F8478}
.btn.ghost{background:#fff;color:var(--ink);border:.12rem solid var(--line)}
.btn.ghost:hover{background:#EEF2F8}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select{background:#fff;border:.12rem solid var(--line);border-radius:.5rem;padding:.35rem .6rem;font-size:1.05rem}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;max-width:56rem;margin:1.5rem auto 0;width:100%}
.role{background:var(--card);border:.15rem solid var(--line);border-top:.5rem solid var(--c);border-radius:1rem;padding:1.4rem 1rem;cursor:pointer;text-align:center}
.role:hover{background:#EEF8F6}
.role b{display:block;font-size:1.8rem;font-weight:800}
.role span{color:var(--muted);font-weight:600;font-size:1.05rem}
.soundbtn{position:fixed;right:1rem;bottom:1rem;z-index:9}
.setgrid{display:grid;gap:.6rem}
.setgrid label{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-weight:700;font-size:1.1rem}
.setgrid input{width:6rem;font-size:1.2rem;font-weight:700;padding:.3rem .5rem;border:.12rem solid var(--line);border-radius:.5rem;background:#fff}
.setgrid input:disabled{opacity:.5}
.rvwrap{margin:auto 0;width:100%}
.review{display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:left}
.rcol h3{font-size:1.4rem;font-weight:800;margin-bottom:.5rem}
.rcol.g h3{color:var(--good)} .rcol.b h3{color:var(--bad)}
.rv{background:var(--card);border:.12rem solid var(--line);border-left:.45rem solid var(--good);border-radius:.7rem;padding:.4rem .8rem;margin-bottom:.45rem}
.rv.b{border-left-color:var(--bad)}
.rv .rq{font-weight:700;font-size:1.02rem;line-height:1.2}
.rv .ra{font-size:.95rem;color:var(--muted);font-weight:600;line-height:1.25;margin-top:.15rem}
.rv .ra b{color:var(--ink)}
@media (max-width:900px){.review{grid-template-columns:1fr}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:.2rem solid #FFB800;outline-offset:.15rem}
@media (max-width:900px){.hostgrid{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.roles{grid-template-columns:1fr}.chips{grid-template-columns:repeat(2,1fr)}}
/* ===== host PIN gate ===== */
#pinGate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1rem;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#1b3a73 0,#0d1b3d 45%,#050b1c 100%);color:#fff;transition:opacity .45s ease,transform .45s ease;
  --st:#F2B632}
#pinGate.warn{--st:#F2B632} #pinGate.bad{--st:#FF5A4D} #pinGate.ok{--st:#3DDC6B}
#pinGate.gone{opacity:0;transform:scale(1.06);pointer-events:none}
.pg-stars{position:absolute;inset:0;pointer-events:none}
.pg-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.25;animation:pgtw var(--t) ease-in-out var(--d) infinite alternate}
@keyframes pgtw{to{opacity:1;transform:scale(1.5)}}
.pg-planet{position:absolute;left:-9rem;bottom:-9rem;width:22rem;height:22rem;border-radius:50%;
  background:radial-gradient(circle at 70% 25%,#2fb7a8,#12706a 55%,#0a3a40);box-shadow:0 0 5rem rgba(26,163,148,.35);opacity:.9}
.pg-planet.two{left:auto;right:-5rem;top:-5rem;bottom:auto;width:13rem;height:13rem;background:radial-gradient(circle at 30% 70%,#f09a4a,#c65b14 60%,#7a2e08);box-shadow:0 0 4rem rgba(238,116,16,.3)}
.pg-card{position:relative;width:min(27rem,94vw);max-height:96dvh;overflow:auto;text-align:center;padding:1.1rem 1.8rem 1.2rem;border-radius:1.4rem;
  background:rgba(14,26,58,.72);border:.1rem solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 1.5rem 4rem rgba(0,0,0,.55),0 0 0 .1rem rgba(255,255,255,.04) inset}
.pg-stripe{position:absolute;left:0;right:0;top:0;height:.35rem;border-radius:1.4rem 1.4rem 0 0;
  background:linear-gradient(90deg,#1E6BB8 0 16.6%,#27A93A 0 33.3%,#EE7410 0 50%,#86239A 0 66.6%,#1AA394 0 83.3%,#C9281B 0)}
.pg-top{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.5rem}
.pg-top img{width:2.2rem;height:2.2rem;object-fit:contain;background:#fff;border-radius:.5rem;padding:.1rem}
.pg-top span{font-size:.78rem;font-weight:700;letter-spacing:.14em;color:#9FB2D6}
.pg-pad{position:relative;height:7.4rem;margin:.5rem 0 .3rem}
.pg-rocket{position:absolute;left:50%;bottom:.55rem;height:6.1rem;width:auto;transform:translateX(-50%);filter:drop-shadow(0 .4rem .8rem rgba(0,0,0,.5));transition:transform 1s cubic-bezier(.5,0,1,.6),opacity 1s}
.pg-flame{transform-origin:40px 112px;opacity:.0;transition:opacity .2s}
.pg-base{position:absolute;left:50%;bottom:0;width:7rem;height:.55rem;transform:translateX(-50%);border-radius:1rem;background:linear-gradient(#4b5d85,#2a3858)}
#pinGate.ok .pg-flame{opacity:1;animation:pgfl .12s linear infinite alternate}
#pinGate.launch .pg-rocket{transform:translateX(-50%) translateY(-60rem);opacity:.9}
@keyframes pgfl{from{transform:scaleY(.8)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:no-preference){ .pg-rocket{animation:pghover 3s ease-in-out infinite alternate} #pinGate.launch .pg-rocket{animation:none} }
@keyframes pghover{from{margin-bottom:0}to{margin-bottom:.35rem}}
.pg-card h1{font-size:2.1rem;font-weight:800;line-height:1.05;margin-top:.8rem}
.pg-card h1 span{display:block;font-size:1.15rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#2FD0BE;margin-top:.15rem}
.pg-sub{color:#B9C6E0;font-weight:600;font-size:1rem;margin:.5rem 0 1rem}
.pg-field{display:flex;align-items:center;gap:.5rem;background:rgba(5,11,28,.7);border:.15rem solid rgba(255,255,255,.2);border-radius:.9rem;padding:.2rem .5rem .2rem .9rem;transition:border-color .2s,box-shadow .2s}
.pg-field:focus-within{border-color:var(--st);box-shadow:0 0 0 .22rem color-mix(in srgb,var(--st) 30%,transparent),0 0 1.4rem color-mix(in srgb,var(--st) 35%,transparent)}
.pg-ico{font-size:1.2rem}
#pgPin{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:1.6rem;font-weight:700;letter-spacing:.16em;padding:.5rem .2rem}
#pgPin::placeholder{letter-spacing:.02em;font-size:1.15rem;font-weight:600;color:#6F82AA}
#pgPin:disabled{opacity:.6}
.pg-eye{border:0;background:rgba(255,255,255,.1);color:#CFE0FF;font-weight:700;font-size:.9rem;padding:.4rem .75rem;border-radius:.6rem;cursor:pointer}
.pg-eye:hover{background:rgba(255,255,255,.2)}
.pg-go{display:block;width:100%;margin-top:.9rem;border:0;border-radius:.9rem;padding:.8rem;font-size:1.3rem;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(90deg,#12988A,#1E6BB8);box-shadow:0 .35rem 0 rgba(0,0,0,.35);transition:filter .15s,transform .08s}
.pg-go:hover:not(:disabled){filter:brightness(1.12)} .pg-go:active:not(:disabled){transform:translateY(.2rem);box-shadow:0 .15rem 0 rgba(0,0,0,.35)}
.pg-go:disabled{filter:grayscale(.7) brightness(.8);cursor:not-allowed}
.pg-msg{min-height:1.5rem;margin-top:.7rem;font-weight:700;font-size:1rem;color:#FFB4AC}
#pinGate.ok .pg-msg{color:#8CF0A8;font-size:1.25rem}
.pg-status{display:flex;justify-content:center;align-items:center;gap:.5rem;margin-top:.6rem;padding-top:.7rem;border-top:.08rem solid rgba(255,255,255,.12);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9FB2D6}
.pg-status i{width:.65rem;height:.65rem;border-radius:50%;background:var(--st);box-shadow:0 0 .7rem var(--st)}
@media (prefers-reduced-motion:no-preference){
  .pg-status i{animation:pgbl 1.4s ease-in-out infinite}
  .pg-card.shake{animation:pgshake .4s}
}
@keyframes pgbl{50%{opacity:.35}}
@keyframes pgshake{20%{transform:translateX(-.6rem)}40%{transform:translateX(.6rem)}60%{transform:translateX(-.45rem)}80%{transform:translateX(.45rem)}}
@media (max-height:620px){.pg-pad{height:4.9rem}.pg-rocket{height:3.9rem}.pg-card h1{font-size:1.6rem}.pg-sub{margin:.3rem 0 .6rem}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>

<script>

/* Host PIN - change it */
const HOST_PIN = "astro2026";

/* =====================================================================
   2. QUESTIONS - 10 per group (each group of 5 players gets a new set)
   answer = index of the correct option (0 = first). Options are shuffled.
   ===================================================================== */
let GROUPS = [
 { name:"Group 1 - Science Basics", questions:[
  {q:"Which gas do plants absorb from the air for photosynthesis?", options:["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"], answer:1},
  {q:"Which planet is known as the Red Planet?", options:["Venus","Mars","Jupiter","Mercury"], answer:1},
  {q:"What is the chemical formula of water?", options:["HO2","H2O","OH","H2O2"], answer:1},
  {q:"Which organ pumps blood through the human body?", options:["Lungs","Liver","Heart","Kidney"], answer:2},
  {q:"Which force pulls objects towards the Earth?", options:["Magnetism","Friction","Gravity","Inertia"], answer:2},
  {q:"Who is known as the 'Missile Man of India'?", options:["C.V. Raman","A.P.J. Abdul Kalam","Homi Bhabha","Vikram Sarabhai"], answer:1},
  {q:"What is the hardest natural substance?", options:["Gold","Iron","Diamond","Quartz"], answer:2},
  {q:"How many bones are there in an adult human body?", options:["186","206","226","256"], answer:1},
  {q:"Which part of a plant makes its food?", options:["Root","Stem","Leaf","Flower"], answer:2},
  {q:"Which instrument is used to measure temperature?", options:["Barometer","Thermometer","Speedometer","Seismograph"], answer:1}
 ]},
 { name:"Group 2 - Space & Technology", questions:[
  {q:"Which ISRO mission landed near the Moon's south pole in 2023?", options:["Mangalyaan","Chandrayaan-3","Aditya-L1","Gaganyaan"], answer:1},
  {q:"Which is the largest planet in our Solar System?", options:["Saturn","Jupiter","Neptune","Earth"], answer:1},
  {q:"Which star is closest to the Earth?", options:["Sirius","Proxima Centauri","The Sun","Polaris"], answer:2},
  {q:"What does CPU stand for?", options:["Central Process Unit","Central Processing Unit","Computer Personal Unit","Control Processing Unit"], answer:1},
  {q:"Approximately how fast does light travel?", options:["3,000 km/s","30,000 km/s","3,00,000 km/s","30,00,000 km/s"], answer:2},
  {q:"Which gas is the most abundant in Earth's atmosphere?", options:["Oxygen","Nitrogen","Carbon dioxide","Argon"], answer:1},
  {q:"What is the SI unit of force?", options:["Joule","Watt","Newton","Pascal"], answer:2},
  {q:"Wind turbines produce electricity from which source?", options:["Water","Wind","Coal","Sunlight"], answer:1},
  {q:"Who is said to have discovered gravity after watching an apple fall?", options:["Einstein","Newton","Galileo","Edison"], answer:1},
  {q:"Which planet is famous for its bright rings?", options:["Mars","Saturn","Mercury","Venus"], answer:1}
 ]},
 { name:"Group 3 - Nature & Environment", questions:[
  {q:"Which gas is commonly called 'laughing gas'?", options:["Nitrous oxide","Nitrogen dioxide","Methane","Ammonia"], answer:0},
  {q:"What is the process of water turning into vapour called?", options:["Condensation","Evaporation","Precipitation","Freezing"], answer:1},
  {q:"Which layer of the atmosphere protects us from harmful UV rays?", options:["Ozone layer","Troposphere","Mesosphere","Exosphere"], answer:0},
  {q:"On which date is National Science Day celebrated in India?", options:["28 February","5 June","15 August","2 October"], answer:0},
  {q:"Which is the largest mammal in the world?", options:["African elephant","Blue whale","Giraffe","Hippopotamus"], answer:1},
  {q:"What do we call animals that eat only plants?", options:["Carnivores","Herbivores","Omnivores","Insectivores"], answer:1},
  {q:"How many colours are there in a rainbow?", options:["5","6","7","8"], answer:2},
  {q:"Which vitamin does our skin make with the help of sunlight?", options:["Vitamin A","Vitamin C","Vitamin D","Vitamin K"], answer:2},
  {q:"Which river flows through Pimpri-Chinchwad?", options:["Pavana","Godavari","Krishna","Narmada"], answer:0},
  {q:"What is the scientific study of earthquakes called?", options:["Seismology","Geology","Meteorology","Ecology"], answer:0}
 ]}
];


/* =====================================================================

if(role==='host') document.documentElement.classList.add('host');

  && typeof POINTS!=='undefined' && typeof BUZZ_KEY_LABEL!=='undefined';

const now = () => Date.now()+offset;

/* ---------- small helpers over the live data ---------- */
const S  = () => LIVE.state || null;
const pl = i => (LIVE.players && LIVE.players['s'+i]) || null;
const buzzTs = i => (LIVE.buzzes && typeof LIVE.buzzes['s'+i]==='number') ? LIVE.buzzes['s'+i] : undefined;
const isAtt = (st,i) => !!(st && st.attempted && st.attempted['s'+i]);
const playerCount = () => [0,1,2,3,4].filter(i=>pl(i)).length;
function buzzOrder(st, onlyPending){
  return [0,1,2,3,4].filter(i=>pl(i) && buzzTs(i)!==undefined && !(onlyPending && isAtt(st,i)))
    .sort((a,b)=>buzzTs(a)-buzzTs(b)||a-b);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function prepare(g,n){
  return GROUPS[g].questions.slice(0, Math.max(1, Math.min(n||99, GROUPS[g].questions.length))).map(q=>{
    const idx = shuffle(q.options.map((_,i)=>i));
    return { q:q.q, options:idx.map(i=>q.options[i]), answer:idx.indexOf(q.answer) };
  });
}
const clean = o => JSON.parse(JSON.stringify(o));

/* ---------- start-up ---------- */
function boot(){
  if(!role){ landing(); return; }
  if(!configLoaded){
    app.innerHTML = shell(`<div class="center"><h1 class="big">config.js not found</h1>
      <p class="sub">Put <b>config.js</b> in the same folder as this page (the same folder on the website if it is hosted), then reload with Ctrl+F5.</p></div>`);
    return;
  }
  if(!configured){ setupMessage(); return; }
  if(typeof firebase==='undefined'){ app.innerHTML = shell('<div class="center"><h1 class="big">No internet</h1><p class="sub">This quiz needs an internet connection on every PC.</p></div>'); return; }
  if(role==='host' && !hostUnlocked()){ pinScreen(); return; }
  startApp();
}

          <path d="M22 112 L22 82 L6 118 Z" fill="#C9281B" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>
          <path d="M58 112 L58 82 L74 118 Z" fill="#C9281B" stroke="#14213D" stroke-width="3" stroke-linejoin="round"/>

      </div>
      <h1 id="pgTitle">Astro-Fest <span>Mission Control</span></h1>
      <p class="pg-sub">Host clearance required</p>
      <div class="pg-field" id="pgField">
        <span class="pg-ico" aria-hidden="true">&#128274;</span>
        <input id="pgPin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter host PIN" aria-label="Host PIN">

    </div>`;
  document.body.appendChild(g);

  // twinkling star field
  const st = g.querySelector('.pg-stars');
  for(let i=0;i<110;i++){
    const d = document.createElement('i');
    d.style.cssText = 'left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;--s:'+(1+Math.random()*2.6)+'px;--d:'+(Math.random()*5)+'s;--t:'+(2+Math.random()*4)+'s';
    st.appendChild(d);
  }

  const $ = id => document.getElementById(id);
  const inp=$('pgPin'), msg=$('pgMsg'), card=$('pgCard'), go=$('pgGo'), stat=$('pgStatus').querySelector('span');
  let fails=0, locked=false;
  const setState = (cls,text) => { g.classList.remove('warn','bad','ok'); if(cls) g.classList.add(cls); stat.textContent=text; };

  function lockout(sec){
    locked=true; inp.disabled=true; go.disabled=true;
    const tick=()=>{ if(sec<=0){ locked=false; fails=0; inp.disabled=false; go.disabled=false; msg.textContent=''; setState('','Awaiting host PIN'); inp.focus(); return; }
      msg.textContent='Too many wrong tries. Try again in '+sec+'s'; setState('bad','Console locked'); sec--; setTimeout(tick,1000); };
    tick();
  }
  function submit(){
    if(locked) return;
    if(!inp.value){ msg.textContent='Please type the host PIN.'; setState('warn','Awaiting host PIN'); inp.focus(); return; }
    if(inp.value===HOST_PIN){ success(); return; }
    fails++; inp.value='';
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    if(fails>=5){ lockout(30); return; }
    msg.textContent='Access denied. '+(5-fails)+' '+(5-fails===1?'try':'tries')+' left.';
    setState('bad','Access denied'); inp.focus();
  }
  function success(){
    locked=true; inp.disabled=true; go.disabled=true;
    try{ sessionStorage.setItem('astro_host_ok','1'); }catch(e){}
    setState('ok','Cleared for launch'); msg.textContent='';
    const finish = () => { g.classList.add('gone'); setTimeout(()=>{ g.remove(); startApp(); }, reduce?0:450); };
    if(reduce){ finish(); return; }
    let n=3; msg.textContent='T-minus '+n+'...';
    const t=setInterval(()=>{ n--; if(n>0){ msg.textContent='T-minus '+n+'...'; } else { clearInterval(t); msg.textContent='Liftoff!'; g.classList.add('launch'); setTimeout(finish,900); } },450);
  }

  go.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); submit(); }
    if(e.getModifierState && e.getModifierState('CapsLock')) msg.textContent='Caps Lock is on';
  });
  inp.addEventListener('input', ()=>{ if(!locked){ msg.textContent=''; setState(inp.value?'warn':'', inp.value?'Code being entered':'Awaiting host PIN'); } });
  $('pgEye').addEventListener('click', ()=>{ const show = inp.type==='password'; inp.type = show?'text':'password'; $('pgEye').textContent = show?'Hide':'Show'; inp.focus(); });
  inp.focus();
}

function startApp(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database(); L = db.ref('astrofest/live'); R = db.ref('astrofest/records');
  db.ref('.info/serverTimeOffset').on('value',s=>{ offset = s.val()||0; });
  db.ref('.info/connected').on('value',s=>{ CONNECTED = !!s.val(); if(role!=='screen') render(); });
  L.on('value', snap=>{
    LIVE = snap.val() || {};
    if(role==='host'){
      if(!hostReady){ hostReady=true; H = LIVE.state ? clean(LIVE.state) : null; QSLOCAL = LIVE.qs || null; }
      hostReact();
    }
    if(role==='screen') screenSounds();
    render();
  });
  if(role==='host') setInterval(hostTimeouts,250);
  setInterval(tick,200);
  render();
}

/* ---------- sounds (big screen) ---------- */
let ac=null, soundOn=false;
function tone(f,d,type='sine',when=0,vol=.22){
  if(!soundOn) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+when;
    o.type=type; o.frequency.value=f; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx = {
  buzz(){ tone(880,.25,'square'); tone(660,.25,'square',.12); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.1)); },
  wrong(){ tone(180,.5,'sawtooth',0,.18); },
  time(){ tone(330,.35,'triangle'); },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',i*.14)); }
};
let prevS = {};
function screenSounds(){
  const s = S() || {};
  const lw = s.lastWrong ? s.matchId+s.qi+JSON.stringify(s.lastWrong) : '';
  if(s.phase==='answering' && prevS.turnId!==s.turnId) sfx.buzz();
  if(lw && lw!==prevS.lw) sfx.wrong();
  if(s.phase==='result' && prevS.phase!=='result'){ s.outcome==='correct' ? sfx.right() : sfx.time(); }
  if(s.phase==='final' && prevS.phase!=='final') sfx.win();
  prevS = { phase:s.phase, turnId:s.turnId, lw };
}

/* ---------- host logic (the only device that changes the game state) ---------- */
function commit(extra){ L.update(Object.assign({state:clean(H)}, extra||{})); }
function QS(){ return QSLOCAL || LIVE.qs || []; }
function newState(patch){
  return Object.assign({matchId:null,phase:'register',group:0,groupName:'',qi:-1,nq:10,q:null,turn:null,turnId:0,
    attempted:{},lastWrong:null,showReview:false,deadline:0,dur:1000,outcome:null,seatResult:null,chosen:null,qOpenedAt:0,turnStart:0},patch);
}
function openRegistration(){
  const g = SELGROUP = +document.getElementById('grp').value;
  H = newState({ matchId:'m'+Date.now(), group:g, groupName:GROUPS[g].name });
  QSLOCAL = null; Q_ATT = [];
  commit({players:null,buzzes:null,answer:null,qs:null,review:null});
}
function startQuiz(){
  if(playerCount()<2) return;
  QSLOCAL = prepare(H.group, CFG.nq);
  H.nq = QSLOCAL.length; H.phase='lobby';
  const players={}; [0,1,2,3,4].forEach(i=>{ if(pl(i)) players['s'+i]={seat:i+1,name:pl(i).name}; });
  R.child(H.matchId).update({matchId:H.matchId,group:H.groupName,startedAt:TS(),players});
  commit({qs:QSLOCAL});
}
function nextQuestion(){
  if(!H) return;
  const qi = H.qi+1;
  if(qi>=H.nq){ finishMatch(); return; }
  const q = QS()[qi];
  Object.assign(H,{ phase:'open', qi, q:{text:q.q,options:q.options}, turn:null, attempted:{}, lastWrong:null,
    outcome:null, seatResult:null, chosen:null, qOpenedAt:now(), dur:CFG.buzz*1000, deadline:now()+CFG.buzz*1000 });
  Q_ATT = [];
  commit({buzzes:null,answer:null});
}
function startTurn(seat){
  Object.assign(H,{ phase:'answering', turn:seat, turnId:H.turnId+1, turnStart:now(), dur:CFG.answer*1000, deadline:now()+CFG.answer*1000 });
  commit({answer:null});
}
function finalizeQuestion(outcome, seat){
  const q = QS()[H.qi];
  const winner = seat!=null && pl(seat) ? pl(seat).name : '';
  const attempts = Q_ATT.map(a=>({player:a.player,given:a.given,result:a.result}));
  const key = outcome==='correct' ? 'correct' : outcome==='skipped' ? 'skipped' : outcome==='nobody buzzed' ? 'nobuzz' : 'allwrong';
  R.child(H.matchId+'/questions/'+(H.qi+1)).set({qNo:H.qi+1,question:q.q,correctAnswer:q.options[q.answer],outcome,winner,attempts});
  L.child('review/q'+(H.qi+1)).set({qNo:H.qi+1,text:q.q,correctAnswer:q.options[q.answer],outcome:key,winner,attempts});
}
function finishAttempt(seat, choice, timedOut){
  const q = QS()[H.qi], p = pl(seat);
  const correct = !timedOut && choice===q.answer;
  const order = buzzOrder(H,false).indexOf(seat)+1;
  R.child(H.matchId+'/log').push({
    ts:TS(), qNo:H.qi+1, question:q.q, seat:seat+1, player:p.name, buzzOrder:order,
    buzzMs:(buzzTs(seat)||0)-H.qOpenedAt, answerMs:now()-H.turnStart,
    given: timedOut?'(no answer)':q.options[choice], correctAnswer:q.options[q.answer],
    result: timedOut?'timeout':(correct?'correct':'wrong'), points: correct?POINTS:0
  });
  Q_ATT.push({player:p.name, given: timedOut?'(no answer)':q.options[choice], result: timedOut?'timeout':(correct?'correct':'wrong')});
  if(correct){
    Object.assign(H,{ phase:'result', outcome:'correct', seatResult:seat, chosen:choice, deadline:0 });
    finalizeQuestion('correct', seat);
    commit({['players/s'+seat+'/score']:(p.score||0)+POINTS});
    return;
  }
  H.attempted['s'+seat]=true;
  H.lastWrong = {seat, timeout:!!timedOut, n:(H.lastWrong?H.lastWrong.n:0)+1};
  const pending = buzzOrder(H,true);
  if(pending.length){ startTurn(pending[0]); return; }
  if(Object.keys(H.attempted).length < playerCount()){
    Object.assign(H,{ phase:'open', turn:null, dur:CFG.buzz*1000, deadline:now()+CFG.buzz*1000 });
    commit({answer:null}); return;
  }
  Object.assign(H,{ phase:'result', outcome:'allwrong', turn:null, deadline:0 });
  finalizeQuestion('nobody answered correctly', null);
  commit({answer:null});
}
function skipQuestion(){
  if(!H || !['open','answering'].includes(H.phase)) return;
  Object.assign(H,{ phase:'result', outcome:'skipped', turn:null, deadline:0 });
  finalizeQuestion('skipped', null);
  commit({answer:null});
}
function newQuiz(){
  if(H && ['lobby','open','answering','result'].includes(H.phase)){
    if(!confirm('Stop the current quiz and start a new one?\nScores so far are saved as "stopped early".')) return;
  }
  if(H && H.matchId && ['lobby','open','answering','result'].includes(H.phase)){
    const scores={}; [0,1,2,3,4].forEach(i=>{ const p=pl(i); if(p) scores['s'+i]={name:p.name,score:p.score||0}; });
    R.child(H.matchId).update({endedAt:TS(),stoppedEarly:true,scores,winners:''});
  }
  if(H) SELGROUP = (H.group+1)%GROUPS.length;
  H=null; Q_ATT=[]; QSLOCAL=null; answeredFor=null;
  L.update({state:null,players:null,buzzes:null,answer:null,qs:null,review:null});
}
function finishMatch(){
  H.phase='final'; H.deadline=0; H.turn=null; H.showReview=false; SELGROUP=(H.group+1)%GROUPS.length;
  const scores={}; let max=0;
  [0,1,2,3,4].forEach(i=>{ const p=pl(i); if(p){ scores['s'+i]={name:p.name,score:p.score||0}; max=Math.max(max,p.score||0);} });
  const winners = max>0 ? Object.values(scores).filter(x=>x.score===max).map(x=>x.name).join(' & ') : '';
  R.child(H.matchId).update({endedAt:TS(),scores,winners});
  commit();
}
function hostReact(){
  if(!H) return;
  if(H.phase==='open'){
    const q = buzzOrder(H,true);
    if(q.length) startTurn(q[0]);
  } else if(H.phase==='answering'){
    const a = LIVE.answer;
    if(a && a.turnId===H.turnId && a.seat===H.turn && !(H.answeredTurn===H.turnId)){
      H.answeredTurn = H.turnId;
      finishAttempt(a.seat, a.choice, false);
    }
  }
}
function hostTimeouts(){
  if(!H) return;
  if(H.phase==='open' && now()>H.deadline){
    const anyAtt = Object.keys(H.attempted).length>0;
    Object.assign(H,{ phase:'result', outcome: anyAtt?'allwrong':'nobuzz', turn:null, deadline:0 });
    finalizeQuestion(anyAtt?'nobody answered correctly':'nobody buzzed', null);
    commit({answer:null});
  } else if(H.phase==='answering' && now()>H.deadline){
    H.answeredTurn = H.turnId;
    finishAttempt(H.turn, null, true);
  }
}

/* ---------- player actions ---------- */
function myInfo(){
  try{
    const m = JSON.parse(localStorage.getItem('astro_me')||'null');
    if(m){ const p=pl(m.seat); if(p && p.cid===m.cid) return m; }
  }catch(e){}
  return null;
}
function joinGame(){
  const inp = document.getElementById('pname'); const name = inp.value.trim().slice(0,22);
  if(!name){ inp.focus(); return; }
  const s = S(); if(!s || s.phase!=='register') return;
  const cid = Math.random().toString(36).slice(2,10);
  L.child('players').transaction(cur=>{
    cur = cur || {};
    for(let i=0;i<5;i++){ if(!cur['s'+i]){ cur['s'+i]={name,score:0,cid,joinedAt:Date.now()}; return cur; } }
    return;
  }, (err, committed, snap)=>{
    if(!committed){ document.getElementById('jmsg').textContent = err ? 'Could not join. Check internet and try again.' : 'This round already has 5 players.'; return; }
    const v = snap.val(); const key = Object.keys(v).find(k=>v[k].cid===cid);
    if(!key) return;
    localStorage.setItem('astro_me', JSON.stringify({seat:+key.slice(1), cid, matchId:S().matchId}));
    render();
  });
}
function doBuzz(){
  const m = myInfo(), s = S(); if(!m||!s) return;
  if(!['open','answering'].includes(s.phase)) return;
  if(s.turn===m.seat || isAtt(s,m.seat) || buzzTs(m.seat)!==undefined) return;
  L.child('buzzes/s'+m.seat).set(TS());
}
let answeredFor=null;
function doAnswer(i){
  const m = myInfo(), s = S(); if(!m||!s) return;
  if(s.phase!=='answering' || s.turn!==m.seat || answeredFor===s.turnId) return;
  answeredFor = s.turnId;
  L.child('answer').set({seat:m.seat, choice:i, turnId:s.turnId});
  render();
}

/* ---------- views ---------- */
const meta = s => !s ? '' : `${esc(s.groupName||'')}<small>${s.qi>=0&&['open','answering','result'].includes(s.phase)?`Question ${s.qi+1} of ${s.nq}`:''}</small>`;
const timerHTML = `<div class="timer"><div class="track"><div class="fill" id="tbar"></div></div><div class="num" id="tnum"></div></div>`;
function tick(){
  const s=S(); const n=document.getElementById('tnum'), b=document.getElementById('tbar');
  if(!n || !s || !s.deadline) return;
  const ms = Math.max(0,s.deadline-now());
  n.textContent = Math.ceil(ms/1000);
  b.style.width = (100*ms/s.dur)+'%';
}
function optionsHTML(s, mode){   // mode: 'screen' | 'pick' | 'host'
  const q = s.q; let key=null;
  if(mode==='host' || s.phase==='result') key = (QS()[s.qi]||{}).answer;
  return `<div class="opts">${q.options.map((o,i)=>{
    let cls='';
    if(s.phase==='result'){ cls = i===key ? 'correct' : 'dim'; }
    else if(mode==='host' && i===key) cls='correct';
    const pick = mode==='pick';
    return `<${pick?'button':'div'} class="opt ${pick?'pick':''} ${cls}" ${pick?`data-opt="${i}"`:''}><span class="l">${LET[i]}</span><span>${esc(o)}</span></${pick?'button':'div'}>`;
  }).join('')}</div>`;
}
function bannerHTML(s){
  const p = s.turn!=null ? pl(s.turn) : null;
  const lw = s.lastWrong && pl(s.lastWrong.seat);
  const lwText = lw ? `${esc(lw.name)} ${s.lastWrong.timeout?'ran out of time':'answered wrong'}.` : '';
  switch(s.phase){
    case 'open': return `<div class="banner open"><span>${lw?lwText+' Buzzers are open again!':'Buzzers are open. Press your buzzer!'}</span>${timerHTML}</div>`;
    case 'answering': {
      const nxt = buzzOrder(s,true).filter(i=>i!==s.turn).map(i=>esc(pl(i).name));
      return `<div class="banner buzzed" style="--c:${COLORS[s.turn]}"><div><small>${lw?lwText+' Next in line:':'First to buzz'}</small><div class="name">${esc(p?p.name:'')}</div></div>
        <span>${nxt.length?`<small>Waiting: ${nxt.join(', ')}</small>`:''}</span>${timerHTML}</div>`; }
    case 'result': {
      const w = s.seatResult!=null ? pl(s.seatResult) : null;
      if(s.outcome==='correct') return `<div class="banner good"><span>Correct! ${esc(w?w.name:'')} scores ${POINTS} points</span></div>`;
      if(s.outcome==='allwrong') return `<div class="banner bad"><span>Nobody got it right. No points this round</span></div>`;
      if(s.outcome==='skipped') return `<div class="banner none"><span>Question skipped</span></div>`;
      return `<div class="banner none"><span>Time is up. Nobody buzzed</span></div>`; }
  }
  return '';
}
function chipsHTML(s){
  const order = s ? buzzOrder(s,true) : [];
  return `<footer class="chips">${[0,1,2,3,4].map(i=>{
    const p=pl(i);
    if(!p) return `<div class="chip empty" style="--c:${COLORS[i]}"><div class="who"><b>Player ${i+1}</b><small>waiting...</small></div></div>`;
    const active = s && s.phase==='answering' && s.turn===i;
    const out = s && ['open','answering'].includes(s.phase) && isAtt(s,i);
    const pos = order.indexOf(i);
    const note = active ? 'answering' : out ? 'already tried' : (s && ['open','answering'].includes(s.phase) && pos>-1) ? `in line (${pos+1})` : '';
    return `<div class="chip ${active?'active':''} ${out?'out':''}" style="--c:${COLORS[i]}"><div class="who"><b>${esc(p.name)}</b><small>${note}</small></div><div class="sc">${p.score||0}</div></div>`;
  }).join('')}</footer>`;
}
function finalHTML(){
  const ps = [0,1,2,3,4].filter(i=>pl(i)).map(i=>({i,name:pl(i).name,score:pl(i).score||0}));
  const max = Math.max(0,...ps.map(p=>p.score));
  if(max===0) return `<div class="center"><h1 class="big">Quiz complete</h1><p class="sub">Nobody scored this round. Thank you for playing!</p></div>`;
  const winners = ps.filter(p=>p.score===max), tie = winners.length>1;
  return `<div class="center"><div class="trophy">&#127942;</div>
    <p class="win-sub">${tie?'It is a tie! Winners':'Congratulations! Winner'}</p>
    <div class="win-name" style="color:${tie?'var(--teal)':COLORS[winners[0].i]}">${winners.map(w=>esc(w.name)).join(' &amp; ')}</div>
    <p class="win-sub">${max} points</p>
    <div class="rank">${[...ps].sort((a,b)=>b.score-a.score).map(p=>`<div style="--c:${COLORS[p.i]}">${esc(p.name)}<b>${p.score}</b></div>`).join('')}</div></div>`;
}

/* answer review (after the quiz) */
const OUTTXT = {allwrong:'Nobody answered correctly', nobuzz:'Nobody buzzed', skipped:'Question skipped'};
function reviewHTML(){
  const items = Object.values(LIVE.review||{}).sort((a,b)=>a.qNo-b.qNo);
  if(!items.length) return '<p class="note">No questions were played.</p>';
  const wrongs = x => (x.attempts||[]).filter(a=>a.result!=='correct').map(a=>`${esc(a.player)} (${a.result==='timeout'?'no answer':esc(a.given)})`).join(', ');
  const card = (x,good)=>`<div class="rv ${good?'':'b'}"><div class="rq"><b>Q${x.qNo}.</b> ${esc(x.text)}</div>
    <div class="ra">${good?`Correct answer: <b>${esc(x.correctAnswer)}</b>. Answered by <b>${esc(x.winner)}</b>`:`${esc(OUTTXT[x.outcome]||'')}. Correct answer: <b>${esc(x.correctAnswer)}</b>`}
    ${wrongs(x)?`<br>Wrong: ${wrongs(x)}`:''}</div></div>`;
  const ok = items.filter(x=>x.outcome==='correct'), bad = items.filter(x=>x.outcome!=='correct');
  return `<div class="review">
    <div class="rcol g"><h3>Answered correctly (${ok.length})</h3>${ok.map(x=>card(x,true)).join('')||'<p class="note">None</p>'}</div>
    <div class="rcol b"><h3>Not answered correctly (${bad.length})</h3>${bad.map(x=>card(x,false)).join('')||'<p class="note">None</p>'}</div></div>`;
}
const reviewScreen = () => `<div class="rvwrap"><h1 class="big" style="font-size:2.6rem;text-align:center;margin-bottom:.8rem">Quiz review</h1>${reviewHTML()}</div>`;

/* big screen */
function screenView(){
  const s = S();
  let main;
  if(!s || !s.phase) main = `<div class="center"><h1 class="big">Welcome to Astro-Fest</h1><p class="sub">The quiz will begin shortly</p></div>`;
  else if(s.phase==='register') main = `<div class="center"><h1 class="big">Player registration</h1><p class="sub">Open the quiz on your computer, enter your name and join</p>
      <p class="sub" style="color:var(--ink);font-size:2.2rem">${playerCount()} of 5 players have joined</p></div>`;
  else if(s.phase==='lobby') main = `<div class="center"><h1 class="big">${esc(s.groupName)}</h1><p class="sub">${s.nq} questions &middot; ${POINTS} points for every correct answer</p>
      <p class="sub" style="margin-top:1.4rem;color:var(--ink)">Press your buzzer first. If you answer wrong, the next player in line gets a chance.</p></div>`;
  else if(s.phase==='final') main = s.showReview ? reviewScreen() : finalHTML();
  else main = `<div class="qmeta">${POINTS} points</div><h1 class="qtext">${esc(s.q.text)}</h1>${bannerHTML(s)}${optionsHTML(s,'screen')}`;
  app.innerHTML = shell(main, meta(s)).replace('</main>',m=>m+chipsHTML(s)) +
    (soundOn?'':'<button class="btn soundbtn" data-act="sound">Click to enable sound</button>');
  if(s && s.phase==='final' && !s.showReview) startConfetti(); else stopConfetti();
  tick();
}

/* player PC */
function playerView(){
  const s = S(), m = myInfo();
  let main;
  if(!s || !s.phase){ main = `<div class="center"><h1 class="big">Please wait</h1><p class="sub">The host has not opened registration yet</p></div>`; }
  else if(!m){
    if(s.phase==='register'){
      const saved = localStorage.getItem('astro_name')||'';
      main = `<div class="center"><h1 class="big">Join the quiz</h1><p class="sub">Type your name</p>
        <div class="joinbox"><input id="pname" maxlength="22" placeholder="Your name" value="${esc(saved)}" autocomplete="off">
        <button class="btn go" data-act="join" style="font-size:1.4rem;padding:.7rem">Join</button><p class="note" id="jmsg"></p></div></div>`;
      if(document.getElementById('pname')) return;   // keep what the player is typing
    } else main = `<div class="center"><h1 class="big">Registration closed</h1><p class="sub">Please wait for the next round</p></div>`;
  } else {
    const p = pl(m.seat), c = COLORS[m.seat];
    const head = `<div class="me" style="--c:${c}"><div><small>Player</small><b>${esc(p.name)}</b></div><span class="keytag">Buzzer key: ${BUZZ_KEY_LABEL}</span></div>`;
    let body='';
    if(s.phase==='register' || s.phase==='lobby') body = `<h1 class="big" style="font-size:2.6rem">You are in!</h1><p class="sub">Waiting for the quiz to start</p>`;
    else if(s.phase==='final'){
      const max = Math.max(0,...[0,1,2,3,4].filter(i=>pl(i)).map(i=>pl(i).score||0));
      body = (max>0 && (p.score||0)===max) ? `<div class="trophy">&#127942;</div><h1 class="big">You won!</h1>` : `<h1 class="big">Thank you for playing</h1><p class="sub">Watch the big screen for the winner</p>`;
    } else {
      const mine = s.phase==='answering' && s.turn===m.seat;
      const att = isAtt(s,m.seat), buzzed = buzzTs(m.seat)!==undefined;
      body = `<h1 class="qtext">${esc(s.q.text)}</h1>`;
      if(mine){
        body += `<div class="banner buzzed" style="--c:${c}"><span>Your turn! Choose A, B, C or D (keys 1-4)</span>${timerHTML}</div>` +
                (answeredFor===s.turnId ? `<p class="sub">Answer sent...</p>` : optionsHTML(s,'pick'));
      } else if(s.phase==='result'){
        body += (s.outcome==='correct' && s.seatResult===m.seat)
          ? `<div class="banner good"><span>Correct! +${POINTS} points</span></div>`
          : `<div class="banner none"><span>Question over. Look at the big screen</span></div>`;
      } else {
        const who = s.phase==='answering' && pl(s.turn) ? `${esc(pl(s.turn).name)} is answering. ` : '';
        const msg = att ? 'You already had your turn on this question' : buzzed ? `${who}You are in line. Wait for your turn` : `${who}Press the buzzer!`;
        body += `<div class="banner open"><span>${msg}</span>${s.phase==='open'?timerHTML:''}</div>
          <button class="buzzbtn" style="--c:${c}" data-act="buzz" ${att||buzzed?'disabled':''}>BUZZ! (${BUZZ_KEY_LABEL})</button>`;
      }
    }
    main = `<div class="center">${head}</div>${body}`;
  }
  app.innerHTML = shell(`<div class="pwrap">${main}</div>`, `<span class="dot ${CONNECTED?'on':''}"></span>${CONNECTED?'Connected':'Offline'}`);
  tick();
}

/* host PC */
function cfgCard(){
  const s=H, started = s && !['register','final'].includes(s.phase);
  const max = GROUPS[s?s.group:SELGROUP].questions.length;
  return `<div class="card"><h2>Quiz settings</h2><div class="setgrid">
    <label>Buzzer time (seconds)<input type="number" data-cfg="buzz" min="5" max="120" value="${CFG.buzz}"></label>
    <label>Answer time (seconds)<input type="number" data-cfg="answer" min="5" max="120" value="${CFG.answer}"></label>
    <label>Number of questions (max ${max})<input type="number" data-cfg="nq" min="1" max="${max}" value="${Math.min(CFG.nq,max)}" ${started?'disabled':''}></label></div>
    <p style="margin-top:.6rem">Time changes apply from the next question. The number of questions can be changed before the quiz starts.</p></div>`;
}
function hostView(){
  if(!hostReady){ app.innerHTML = shell('<div class="center"><h1 class="big">Connecting...</h1></div>'); return; }
  const s = H, ph = s ? s.phase : 'idle';
  let left='', reviewCard='';
  const groupSel = `<select id="grp">${GROUPS.map((g,i)=>`<option value="${i}" ${i===SELGROUP?'selected':''}>${esc(g.name)}</option>`).join('')}</select>`;
  if(!s){
    left = `<div class="card"><h2>Start a new quiz</h2><p>Each group of 5 players gets its own questions. Pick the question set, check the settings, then open registration.</p>
      <div class="row">${groupSel}<label class="btn ghost">Load questions file<input type="file" id="qfile" accept=".json" hidden></label>
      <button class="btn go" data-act="openreg">Open registration</button></div></div>`;
  } else if(ph==='final'){
    left = `<div class="card"><h2>Quiz finished</h2><p>Scores and every answer are saved in the database.</p>
      <div class="row"><button class="btn" data-act="review">${s.showReview?'Show winner on big screen':'Show answer review on big screen'}</button>
      <button class="btn go" data-act="newquiz">Start new quiz</button></div></div>`;
    reviewCard = `<div class="card" style="grid-column:1/-1"><h2>Answer review</h2>${reviewHTML()}</div>`;
  } else if(ph==='register'){
    left = `<div class="card"><h2>Registration is open</h2><p>${esc(s.groupName)}. Players join from their own computers. Start when everyone is in.</p>
      <div class="row"><button class="btn go" data-act="start" ${playerCount()<2?'disabled':''}>Start quiz with ${playerCount()} player${playerCount()===1?'':'s'}</button>
      <button class="btn ghost" data-act="cancel">Cancel</button></div></div>`;
  } else if(ph==='lobby'){
    left = `<div class="card"><h2>Ready</h2><p>${esc(s.groupName)} &middot; ${s.nq} questions. The big screen shows the rules.</p>
      <div class="row"><button class="btn go" data-act="next">Show question 1 (Enter)</button></div></div>`;
  } else {
    const p = s.turn!=null ? pl(s.turn) : null;
    const status = ph==='open' ? 'Buzzers open' : ph==='answering' ? `${esc(p?p.name:'')} is answering` : 'Question finished';
    const wait = buzzOrder(s,true).filter(i=>i!==s.turn).map(i=>esc(pl(i).name));
    left = `<div class="card"><h2>Question ${s.qi+1} of ${s.nq} &middot; ${status}</h2>
      <div class="qtext" style="font-size:1.7rem;margin-bottom:.6rem">${esc(s.q.text)}</div>${optionsHTML(s,'host')}
      ${['open','answering'].includes(ph)?`<div class="banner open" style="margin:.8rem 0 0;font-size:1.2rem"><span>${wait.length?'In line: '+wait.join(', '):'No one else in line'}</span>${timerHTML}</div>`:''}
      <div class="row">${ph==='result'?`<button class="btn go" data-act="next">${s.qi+1>=s.nq?'Show winner':'Next question'} (Enter)</button>`:`<button class="btn danger" data-act="skip">Skip question</button>`}</div></div>`;
  }
  const players = [0,1,2,3,4].map(i=>{
    const p = pl(i);
    return p ? `<div class="pr" style="--c:${COLORS[i]}"><span>${esc(p.name)}</span><b>${p.score||0}</b>${s&&s.phase==='register'?`<button class="btn ghost" data-kick="${i}">Remove</button>`:''}</div>`
             : `<div class="pr free" style="--c:${COLORS[i]}"><span>Seat ${i+1} is free</span></div>`;
  }).join('');
  const right = `<div class="card"><h2>Players</h2><div class="plist">${players}</div></div>
    <div class="card"><h2>Quiz control</h2><div class="row" style="margin-top:0">
      <button class="btn danger" data-act="newquiz" ${s?'':'disabled'}>Start new quiz</button>
      <button class="btn ghost" data-act="screenwin">Open big-screen window</button></div></div>
    <div class="card"><h2>Records</h2><p>Every answer is saved in your Firebase database automatically.</p>
      <div class="row"><button class="btn ghost" data-act="csvlog">Answers (CSV)</button><button class="btn ghost" data-act="csvres">Results (CSV)</button></div></div>`;
  app.innerHTML = shell(`<div class="hostgrid"><div class="col">${left}${cfgCard()}</div><div class="col">${right}</div>${reviewCard}</div>`,
    `<span class="dot ${CONNECTED?'on':''}"></span>Host${s&&s.matchId?'<small>Match '+esc(s.matchId.slice(1))+'</small>':''}`);
  tick();
}

function render(){ if(denied) return; if(role==='host' && document.activeElement && document.activeElement.matches && document.activeElement.matches('input[data-cfg]')) return; if(role==='screen') screenView(); else if(role==='player') playerView(); else if(role==='host') hostView(); }

/* ---------- confetti ---------- */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let parts=[], raf=null;
function startConfetti(){
  if(raf) return;
  cv.style.display='block'; cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#1E6BB8','#27A93A','#EE7410','#86239A','#C9281B','#1AA394','#FFC20E'];
  const burst=()=>{ for(let i=0;i<110;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,w:8+Math.random()*8,h:12+Math.random()*10,vx:-2+Math.random()*4,vy:2+Math.random()*4,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[(Math.random()*cols.length)|0]}); };
  burst(); let t=0;
  const loop=()=>{
    cx.clearRect(0,0,cv.width,cv.height);
    if(++t%140===0) burst();
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
    parts=parts.filter(p=>p.y<cv.height+30);
    raf=requestAnimationFrame(loop);
  };
  loop();
}
function stopConfetti(){ if(raf){cancelAnimationFrame(raf);raf=null;} parts=[]; cv.style.display='none'; }
addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});

/* ---------- records: download CSV ---------- */
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function download(name, rows){
  const blob = new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
}
const fmtDate = t => t ? new Date(t).toLocaleString('en-IN') : '';
async function exportCSV(kind){
  const snap = await R.once('value'); const all = snap.val()||{};
  if(kind==='log'){
    const rows=[['Match ID','Group','Date & time','Question no.','Question','Player seat','Player','Buzz order','Time to buzz (s)','Time to answer (s)','Answer given','Correct answer','Result','Points']];
    Object.values(all).forEach(m=>Object.values(m.log||{}).sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push([m.matchId,m.group,fmtDate(e.ts),e.qNo,e.question,e.seat,e.player,e.buzzOrder,(e.buzzMs/1000).toFixed(2),(e.answerMs/1000).toFixed(2),e.given,e.correctAnswer,e.result,e.points])));
    download('astrofest_answers.csv',rows);
  } else {
    const rows=[['Match ID','Group','Started','Ended','Stopped early','Player','Score','Winner']];
    Object.values(all).forEach(m=>Object.values(m.scores||{}).forEach(p=>rows.push([m.matchId,m.group,fmtDate(m.startedAt),fmtDate(m.endedAt),m.stoppedEarly?'Yes':'',p.name,p.score,(m.winners||'').split(' & ').includes(p.name)&&p.score>0?'Yes':''])));
    download('astrofest_results.csv',rows);
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t = e.target.closest('[data-act],[data-opt],[data-kick]'); if(!t) return;
  if(t.dataset.opt!==undefined){ doAnswer(+t.dataset.opt); return; }
  if(t.dataset.kick!==undefined){ L.child('players/s'+t.dataset.kick).remove(); return; }
  const a = t.dataset.act;
  if(a==='join'){ localStorage.setItem('astro_name', document.getElementById('pname').value.trim()); joinGame(); }
  else if(a==='buzz') doBuzz();
  else if(a==='sound'){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); soundOn=true; render(); sfx.right(); }
  else if(a==='openreg') openRegistration();
  else if(a==='start') startQuiz();
  else if(a==='cancel'){ H=null; L.update({state:null,players:null,buzzes:null,answer:null,qs:null,review:null}); }
  else if(a==='newquiz') newQuiz();
  else if(a==='review'){ H.showReview=!H.showReview; commit(); }
  else if(a==='next') nextQuestion();
  else if(a==='skip') skipQuestion();
  else if(a==='csvlog') exportCSV('log');
  else if(a==='csvres') exportCSV('res');
  else if(a==='screenwin') window.open('bigscreen.html','astro-screen');
});
document.addEventListener('change',e=>{
  if(role!=='host') return;
  const el=e.target;
  if(el.dataset && el.dataset.cfg){
    const k=el.dataset.cfg, max=GROUPS[H?H.group:SELGROUP].questions.length;
    const lim = k==='nq' ? [1,max] : [5,120];
    let v = Math.round(+el.value); if(!v) v = CFG[k];
    CFG[k] = Math.min(lim[1],Math.max(lim[0],v)); el.value = CFG[k];
    try{ localStorage.setItem('astro_cfg', JSON.stringify(CFG)); }catch(x){}
    return;
  }
  if(el.id==='grp'){ SELGROUP=+el.value; CFG.nq=Math.min(CFG.nq,GROUPS[SELGROUP].questions.length); render(); return; }
  if(el.id!=='qfile') return;
  const f=el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d)||!d.every(g=>g.name&&Array.isArray(g.questions))) throw 0;
    GROUPS=d; SELGROUP=0; render(); alert('Loaded '+GROUPS.length+' question set(s).');
  }catch(x){ alert('Could not read that file. It must be a JSON list of {name, questions:[{q, options, answer}]}.'); } };
  r.readAsText(f);
});
document.addEventListener('focusout',e=>{ if(role==='host' && e.target.matches && e.target.matches('input[data-cfg]')) setTimeout(render,60); });
document.addEventListener('keydown',e=>{
  if(e.repeat) return;
  const typing = e.target.matches && e.target.matches('input,select');
  if(role==='player'){
    if(typing){ if(e.key==='Enter' && e.target.id==='pname'){ localStorage.setItem('astro_name',e.target.value.trim()); joinGame(); } return; }
    if(e.code==='Space'){ e.preventDefault(); doBuzz(); return; }
    const k = e.key.toUpperCase(); const i = '1234'.includes(k)&&k.length===1 ? +k-1 : LET.indexOf(k);
    if(i>-1 && i<4) doAnswer(i);
  } else if(role==='host'){
    if(typing) return;
    if(e.key==='Enter' && H && ['lobby','result'].includes(H.phase)){ e.preventDefault(); nextQuestion(); }
  }
});

boot();
</script>
